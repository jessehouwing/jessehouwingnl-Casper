# This workflow is managed by gh actions-lock.

name: Validate Theme
on:
  pull_request:
  push:
    branches:
      - customized

permissions: {}

jobs:
  validate:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            nodejs.org:443
            registry.yarnpkg.com:443
            repo.yarnpkg.com:443
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: corepack enable
      - run: |
          yarn install
          yarn test:ci
